<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BLIX | OFFICIAL</title>

    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@700&family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>
        :root {
            --bg: #050505;
            --text: #ffffff;
            --secondary: #1a1a1a;

            --brand-spotify: #1DB954;
            --brand-apple: #fc3c44;
            --brand-bandcamp: #629aa9;
            --brand-youtube: #FF0000;
            --brand-instagram: #E4405F;
            --brand-x: #ffffff;
            --brand-facebook: #1877F2;
            --brand-tiktok: #25F4EE;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Inter', sans-serif;
        }

        nav {
            display: flex;
            justify-content: center;
            padding: 3rem 1rem 1rem;
        }

        .logo {
            font-family: 'Oswald', sans-serif;
            font-size: 3rem;
            letter-spacing: 10px;
        }

        header {
            text-align: center;
            padding: 2rem 0 4rem;
        }

        .tagline {
            opacity: 0.6;
            letter-spacing: 6px;
            text-transform: uppercase;
            font-size: 0.8rem;
        }

        .main-content {
            max-width: 700px;
            margin: auto;
            text-align: center;
            padding: 0 5%;
        }

        h2 {
            font-family: 'Oswald', sans-serif;
            margin-bottom: 2rem;
            text-transform: uppercase;
        }

        .tour-placeholder {
            border: 1px solid var(--secondary);
            padding: 2rem;
            color: #555;
            letter-spacing: 2px;
            font-family: 'Oswald', sans-serif;
        }

        footer {
            background: #000;
            margin-top: 6rem;
            padding: 5rem 5% 3rem;
            border-top: 1px solid var(--secondary);
        }

        .footer-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 4rem;
            max-width: 800px;
            margin: auto;
        }

        .dept-title {
            font-family: 'Oswald', sans-serif;
            letter-spacing: 3px;
            margin-bottom: 1.5rem;
            display: block;
        }

        .icon-list {
            display: flex;
            gap: 1.5rem;
            flex-wrap: wrap;
        }

        .social-link {
            font-size: 2rem;
            color: white;
            transition: 0.2s;
        }

        .social-link:hover {
            transform: translateY(-3px);
            opacity: 0.7;
        }

        .fa-spotify { color: var(--brand-spotify); }
        .fa-apple { color: var(--brand-apple); }
        .fa-bandcamp { color: var(--brand-bandcamp); }
        .fa-youtube { color: var(--brand-youtube); }
        .fa-instagram { color: var(--brand-instagram); }
        .fa-x-twitter { color: var(--brand-x); }
        .fa-facebook { color: var(--brand-facebook); }
        .fa-tiktok { color: var(--brand-tiktok); }

        .copyright {
            text-align: center;
            margin-top: 5rem;
            font-size: 0.7rem;
            opacity: 0.3;
            letter-spacing: 2px;
        }

        @media (max-width: 600px) {
            .footer-grid { grid-template-columns: 1fr; text-align: center; }
            .icon-list { justify-content: center; }
        }
    </style>
</head>

<body>

<nav>
    <div class="logo">BLIX</div>
</nav>

<header>
    <p class="tagline">Official Site</p>
</header>

<main class="main-content">
    <h2>Tour</h2>
    <div class="tour-placeholder">DATES COMING SOON</div>
</main>

<footer>
    <div class="footer-grid">

        <div class="dept">
            <span class="dept-title">Music</span>
            <div class="icon-list">

                <a href="#" class="social-link">
                    <i class="fa-brands fa-spotify"></i>
                </a>

                <a href="#" class="social-link">
                    <i class="fa-brands fa-apple"></i>
                </a>

                <a href="#" class="social-link">
                    <i class="fa-brands fa-bandcamp"></i>
                </a>

                <a href="https://youtube.com/@blixcore_4"
                   class="social-link"
                   target="_blank"
                   rel="noopener noreferrer">
                    <i class="fa-brands fa-youtube"></i>
                </a>

            </div>
        </div>

        <div class="dept">
            <span class="dept-title">Social</span>
            <div class="icon-list">

                <a href="#" class="social-link"><i class="fa-brands fa-instagram"></i></a>
                <a href="#" class="social-link"><i class="fa-brands fa-x-twitter"></i></a>
                <a href="#" class="social-link"><i class="fa-brands fa-tiktok"></i></a>
                <a href="#" class="social-link"><i class="fa-brands fa-facebook"></i></a>

            </div>
        </div>

    </div>

    <div class="copyright">
        © 2026 BLIX. ALL RIGHTS RESERVED.
    </div>
</footer>

</body>
</html>
